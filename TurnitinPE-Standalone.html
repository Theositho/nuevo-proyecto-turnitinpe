<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TurnitinPE · Plataforma Académica v2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>:root {
  --bg-app: #f4f7fb;
  --bg-surface: #ffffff;
  --bg-surface-subtle: #f8fafc;
  --bg-surface-hover: #f1f5f9;
  --bg-sidebar: #0c1526;
  --bg-sidebar-hover: rgba(255, 255, 255, 0.06);
  --bg-sidebar-active: #1d4ed8;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --text-on-dark: #f8fafc;
  --text-on-dark-muted: #94a3b8;
  --border-color: #e2e8f0;
  --border-strong: #cbd5e1;
  --brand-primary: #1d4ed8;
  --brand-primary-hover: #1e40af;
  --brand-primary-soft: #eff6ff;
  --brand-accent: #0284c7;
  --emerald: #0d9488;
  --emerald-soft: #f0fdfa;
  --emerald-border: #99f6e4;
  --amber: #d97706;
  --amber-soft: #fffbeb;
  --amber-border: #fde68a;
  --crimson: #dc2626;
  --crimson-soft: #fef2f2;
  --crimson-border: #fecaca;
  --slate-badge: #eef2f6;
  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 2px 6px -1px rgba(15, 23, 42, 0.06), 0 1px 3px -1px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 8px 20px -4px rgba(15, 23, 42, 0.08), 0 3px 8px -3px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 20px 36px -8px rgba(15, 23, 42, 0.14), 0 8px 16px -6px rgba(15, 23, 42, 0.06);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

[data-theme='dark'] {
  --bg-app: #090f1d;
  --bg-surface: #111a2e;
  --bg-surface-subtle: #16213a;
  --bg-surface-hover: #1c2a48;
  --bg-sidebar: #060b16;
  --bg-sidebar-hover: rgba(255, 255, 255, 0.07);
  --bg-sidebar-active: #2563eb;
  --text-primary: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  --border-color: #1e293b;
  --border-strong: #334155;
  --brand-primary: #3b82f6;
  --brand-primary-hover: #2563eb;
  --brand-primary-soft: rgba(59, 130, 246, 0.14);
  --emerald: #14b8a6;
  --emerald-soft: rgba(20, 184, 166, 0.14);
  --emerald-border: rgba(20, 184, 166, 0.35);
  --amber: #f59e0b;
  --amber-soft: rgba(245, 158, 11, 0.14);
  --amber-border: rgba(245, 158, 11, 0.35);
  --crimson: #ef4444;
  --crimson-soft: rgba(239, 68, 68, 0.14);
  --crimson-border: rgba(239, 68, 68, 0.35);
  --slate-badge: #1e293b;
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 24px 48px rgba(0, 0, 0, 0.6);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-app);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
h4 {
  font-family: var(--font-display);
  margin: 0;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

p {
  margin: 0;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

a {
  color: inherit;
  text-decoration: none;
}

/* ==========================================
   AUTHENTICATION / LOGIN SCREEN
   ========================================== */
.auth-layout {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.12fr 0.88fr;
  background: var(--bg-app);
}

.auth-story {
  background: linear-gradient(155deg, #071022 0%, #0d1d3a 55%, #132c58 100%);
  color: #f8fafc;
  padding: 44px 56px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}

.auth-story-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 24px;
  letter-spacing: -0.04em;
  color: var(--text-primary);
}

.brand-dark {
  color: #ffffff;
}

.brand-symbol {
  width: 26px;
  height: 36px;
  object-fit: contain;
}

.brand-badge {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(56, 189, 248, 0.16);
  color: #7dd3fc;
  border: 1px solid rgba(56, 189, 248, 0.28);
}

.auth-story-body {
  max-width: 560px;
  margin: auto 0;
  padding: 32px 0;
}

.auth-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #38bdf8;
  margin-bottom: 16px;
}

.auth-story-body h1 {
  color: #ffffff;
  font-size: clamp(32px, 3.6vw, 46px);
  line-height: 1.1;
  margin-bottom: 18px;
}

.auth-story-lead {
  color: #cbd5e1;
  font-size: 16px;
  line-height: 1.65;
  margin-bottom: 32px;
}

.auth-pillars {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.auth-pillar-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.auth-pillar-icon {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: rgba(56, 189, 248, 0.14);
  color: #38bdf8;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.auth-pillar-card strong {
  font-size: 13.5px;
  color: #f8fafc;
}

.auth-pillar-card span {
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.45;
}

.auth-story-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-top: 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  font-size: 12.5px;
  color: #94a3b8;
}

.auth-panel-wrap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px 32px;
  background: var(--bg-surface);
}

.auth-card {
  width: 100%;
  max-width: 430px;
}

.auth-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}

.auth-card h2 {
  font-size: 26px;
  margin-bottom: 6px;
}

.auth-subtitle {
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 24px;
}

.demo-accounts-box {
  background: var(--bg-surface-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-bottom: 20px;
}

.demo-accounts-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.demo-accounts-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.demo-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 8px 11px;
  border-radius: 8px;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
}

.demo-btn:hover {
  border-color: var(--brand-primary);
  background: var(--brand-primary-soft);
}

.demo-btn strong {
  font-size: 12.5px;
  color: var(--text-primary);
}

.demo-btn span {
  font-size: 11px;
  color: var(--text-muted);
}

/* ==========================================
   MAIN WORKSPACE SHELL & SIDEBAR
   ========================================== */
.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 272px 1fr;
  background: var(--bg-app);
}

.sidebar {
  background: var(--bg-sidebar);
  color: var(--text-on-dark);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: sticky;
  top: 0;
  border-right: 1px solid rgba(255, 255, 255, 0.07);
  z-index: 30;
  overflow-y: auto;
}

.sidebar-brand {
  padding: 22px 20px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}

.sidebar-role-switcher {
  margin: 12px 14px 4px;
  padding: 4px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 9px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}

.role-switch-btn {
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-on-dark-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: all 0.15s;
}

.role-switch-btn.active {
  background: var(--bg-sidebar-active);
  color: #ffffff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
}

.sidebar-nav {
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex: 1;
}

.nav-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.nav-group-label {
  padding: 4px 10px 6px;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #64748b;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9.5px 12px;
  border-radius: 9px;
  color: #cbd5e1;
  font-size: 13.5px;
  font-weight: 500;
  text-align: left;
  transition: background 0.15s, color 0.15s;
}

.nav-item:hover {
  background: var(--bg-sidebar-hover);
  color: #ffffff;
}

.nav-item-active {
  background: var(--bg-sidebar-active);
  color: #ffffff;
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(29, 78, 216, 0.32);
}

.nav-item-text {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-count {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  color: #e2e8f0;
}

.nav-badge-pro {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 5px;
  background: rgba(20, 184, 166, 0.2);
  color: #5eead4;
}

.sidebar-footer {
  padding: 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sidebar-station-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.24);
  font-size: 11.5px;
  color: #a7f3d0;
}

.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
  flex-shrink: 0;
}

.sidebar-profile-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-profile-btn {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  text-align: left;
  color: #f8fafc;
  min-width: 0;
}

.sidebar-profile-btn:hover {
  background: rgba(255, 255, 255, 0.08);
}

.sidebar-profile-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.sidebar-profile-info strong {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-profile-info small {
  font-size: 11px;
  color: #94a3b8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #cbd5e1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.sidebar-icon-btn:hover {
  background: rgba(255, 255, 255, 0.12);
  color: #ffffff;
}

/* ==========================================
   MAIN CONTENT AREA & TOPBAR
   ========================================== */
.main-shell {
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 20;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.mobile-menu-btn {
  display: none;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
}

.topbar-breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-muted);
}

.topbar-breadcrumb strong {
  color: var(--text-primary);
  font-weight: 600;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.quota-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: var(--bg-surface-subtle);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
}

.main-content {
  padding: 28px;
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.page-eyebrow {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--brand-primary);
  margin-bottom: 4px;
}

.page-header h1 {
  font-size: 26px;
  line-height: 1.2;
}

.page-header p {
  color: var(--text-secondary);
  font-size: 14px;
  margin-top: 4px;
}

.page-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

/* ==========================================
   BUTTONS, INPUTS, AVATARS, PILLS
   ========================================== */
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 16px;
  min-height: 38px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.button-sm {
  min-height: 32px;
  padding: 6px 12px;
  font-size: 12px;
}

.button-primary {
  background: var(--brand-primary);
  color: #ffffff;
  border: 1px solid var(--brand-primary);
  box-shadow: 0 2px 5px rgba(29, 78, 216, 0.22);
}

.button-primary:hover:not(:disabled) {
  background: var(--brand-primary-hover);
  border-color: var(--brand-primary-hover);
}

.button-secondary {
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
}

.button-secondary:hover:not(:disabled) {
  background: var(--bg-surface-hover);
  border-color: var(--border-strong);
}

.button-emerald {
  background: var(--emerald);
  color: #ffffff;
  border: 1px solid var(--emerald);
}

.button-emerald:hover:not(:disabled) {
  filter: brightness(0.93);
}

.button-danger {
  background: var(--crimson);
  color: #ffffff;
  border: 1px solid var(--crimson);
}

.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
  transition: all 0.15s;
}

.icon-btn:hover:not(:disabled) {
  background: var(--bg-surface-hover);
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.icon-btn.danger:hover:not(:disabled) {
  background: var(--crimson-soft);
  color: var(--crimson);
  border-color: var(--crimson-border);
}

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--brand-primary-soft);
  color: var(--brand-primary);
  font-weight: 700;
  font-size: 12.5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.avatar-sm {
  width: 30px;
  height: 30px;
  font-size: 11px;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3.5px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}

.status-pill::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.status-emerald {
  background: var(--emerald-soft);
  color: var(--emerald);
  border: 1px solid var(--emerald-border);
}

.status-amber {
  background: var(--amber-soft);
  color: var(--amber);
  border: 1px solid var(--amber-border);
}

.status-crimson {
  background: var(--crimson-soft);
  color: var(--crimson);
  border: 1px solid var(--crimson-border);
}

.status-blue {
  background: var(--brand-primary-soft);
  color: var(--brand-primary);
  border: 1px solid rgba(59, 130, 246, 0.28);
}

.status-slate {
  background: var(--slate-badge);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
}

/* ==========================================
   CARDS, METRICS & PANELS
   ========================================== */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.metric-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  box-shadow: var(--shadow-xs);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.metric-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--text-secondary);
  font-size: 12.5px;
  font-weight: 600;
}

.metric-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.metric-blue {
  background: var(--brand-primary-soft);
  color: var(--brand-primary);
}

.metric-emerald {
  background: var(--emerald-soft);
  color: var(--emerald);
}

.metric-amber {
  background: var(--amber-soft);
  color: var(--amber);
}

.metric-crimson {
  background: var(--crimson-soft);
  color: var(--crimson);
}

.metric-value {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--text-primary);
}

.metric-note {
  font-size: 12px;
  color: var(--text-muted);
}

.panel {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  box-shadow: var(--shadow-xs);
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.panel-header h2 {
  font-size: 17px;
}

.panel-header p {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.overview-grid {
  display: grid;
  grid-template-columns: 1.55fr 1fr;
  gap: 20px;
}

/* ==========================================
   ACADEMIC COURSES & CLASSES (PRO LMS VIEW)
   ========================================== */
.courses-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 18px;
}

.course-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-xs);
  transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
}

.course-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--brand-primary);
}

.course-card-banner {
  padding: 18px 20px;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.course-banner-navy {
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
}

.course-banner-teal {
  background: linear-gradient(135deg, #0f292e 0%, #0d9488 100%);
}

.course-banner-slate {
  background: linear-gradient(135deg, #1e293b 0%, #0284c7 100%);
}

.course-banner-amber {
  background: linear-gradient(135deg, #271705 0%, #b45309 100%);
}

.course-banner-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.course-code-pill {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.16);
  color: #f8fafc;
}

.course-card-banner h3 {
  color: #ffffff;
  font-size: 17px;
  line-height: 1.3;
}

.course-instructor {
  font-size: 12.5px;
  color: rgba(255, 255, 255, 0.82);
}

.course-card-body {
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 1;
}

.course-stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--bg-surface-subtle);
  border: 1px solid var(--border-color);
}

.course-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.course-stat span {
  font-size: 11px;
  color: var(--text-muted);
}

.course-stat strong {
  font-size: 13.5px;
  font-family: var(--font-mono);
  color: var(--text-primary);
}

.course-card-footer {
  padding: 13px 20px;
  border-top: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--bg-surface-subtle);
}

/* ==========================================
   TURNITIN UPLOAD STUDIO & JOBS TABLE
   ========================================== */
.upload-studio-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 20px;
}

.dropzone {
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 32px 24px;
  text-align: center;
  background: var(--bg-surface-subtle);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  transition: all 0.16s ease;
  cursor: pointer;
}

.dropzone:hover,
.dropzone.active {
  border-color: var(--brand-primary);
  background: var(--brand-primary-soft);
}

.dropzone-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--brand-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-xs);
}

.filter-switches {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.filter-switch-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-surface-subtle);
}

.filter-switch-item input[type='checkbox'] {
  margin-top: 3px;
  accent-color: var(--brand-primary);
  width: 16px;
  height: 16px;
}

.score-badges {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.score-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border-radius: 7px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
}

/* ==========================================
   DATA TABLES & TOOLBARS
   ========================================== */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}

.filter-tabs {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  background: var(--bg-surface-subtle);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  flex-wrap: wrap;
}

.filter-tab {
  padding: 6px 12px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-secondary);
  transition: all 0.15s;
}

.filter-tab.active {
  background: var(--bg-surface);
  color: var(--brand-primary);
  box-shadow: var(--shadow-xs);
}

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 13px;
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  min-width: 260px;
}

.search-box input {
  border: none;
  outline: none;
  background: transparent;
  width: 100%;
  font-size: 13px;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.data-table th {
  padding: 12px 14px;
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  background: var(--bg-surface-subtle);
  border-bottom: 1px solid var(--border-color);
  white-space: nowrap;
}

.data-table td {
  padding: 13px 14px;
  border-bottom: 1px solid var(--border-color);
  vertical-align: middle;
  font-size: 13.5px;
}

.data-table tbody tr:hover {
  background: var(--bg-surface-subtle);
}

.person-cell {
  display: flex;
  align-items: center;
  gap: 11px;
}

.person-meta {
  display: flex;
  flex-direction: column;
}

.person-meta strong {
  font-size: 13.5px;
  color: var(--text-primary);
}

.person-meta span {
  font-size: 12px;
  color: var(--text-muted);
}

.code-chip {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  padding: 3px 7px;
  border-radius: 6px;
  background: var(--bg-surface-subtle);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
}

/* ==========================================
   AI LABORATORY & CHAT STUDIO
   ========================================== */
.ai-studio-layout {
  display: grid;
  grid-template-columns: 310px 1fr;
  gap: 20px;
  min-height: 620px;
}

.ai-models-sidebar {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 680px;
  overflow-y: auto;
}

.ai-model-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 12px;
  border-radius: 10px;
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
  text-align: left;
  transition: all 0.15s;
}

.ai-model-item:hover {
  border-color: var(--brand-primary);
  background: var(--bg-surface-subtle);
}

.ai-model-item.active {
  border-color: var(--brand-primary);
  background: var(--brand-primary-soft);
}

.ai-chat-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.ai-chat-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.ai-chat-messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-height: 430px;
}

.chat-bubble {
  max-width: 82%;
  padding: 13px 16px;
  border-radius: 14px;
  font-size: 13.5px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.chat-bubble.user {
  align-self: flex-end;
  background: var(--brand-primary);
  color: #ffffff;
  border-bottom-right-radius: 4px;
}

.chat-bubble.assistant {
  align-self: flex-start;
  background: var(--bg-surface-subtle);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  border-bottom-left-radius: 4px;
}

.ai-prompt-chips {
  padding: 10px 20px;
  border-top: 1px solid var(--border-color);
  background: var(--bg-surface-subtle);
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
}

.prompt-chip {
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  white-space: nowrap;
  color: var(--text-secondary);
}

.prompt-chip:hover {
  border-color: var(--brand-primary);
  color: var(--brand-primary);
}

.ai-chat-input-bar {
  padding: 14px 20px;
  border-top: 1px solid var(--border-color);
  display: flex;
  gap: 10px;
}

.ai-chat-input-bar textarea {
  flex: 1;
  resize: none;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  background: var(--bg-surface-subtle);
  outline: none;
}

.ai-chat-input-bar textarea:focus {
  border-color: var(--brand-primary);
  background: var(--bg-surface);
}

/* ==========================================
   PLANS GRID & SERVICE CARDS
   ========================================== */
.plans-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 18px;
}

.plan-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow-xs);
}

.plan-price-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.plan-price-row strong {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 800;
}

.plan-features-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}

.plan-features-list li {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}

/* ==========================================
   MODALS & FORMS
   ========================================== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(9, 15, 29, 0.65);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 60;
}

.modal-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 620px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  padding: 26px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.modal-card.wide {
  max-width: 860px;
}

.modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

.field input,
.field select,
.field textarea {
  padding: 9.5px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
  font-weight: 450;
  outline: none;
  transition: border-color 0.15s;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--brand-primary);
}

.toast-banner {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 80;
  background: #0f172a;
  color: #ffffff;
  padding: 13px 18px;
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13.5px;
  font-weight: 500;
}

/* ==========================================
   RESPONSIVE BREAKPOINTS
   ========================================== */
@media (max-width: 1120px) {
  .metrics-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .overview-grid,
  .upload-studio-grid,
  .ai-studio-layout {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 880px) {
  .auth-layout {
    grid-template-columns: 1fr;
  }
  .auth-story {
    padding: 32px 24px;
  }
  .auth-pillars {
    grid-template-columns: 1fr;
  }
  .app-shell {
    grid-template-columns: 1fr;
  }
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 280px;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .mobile-menu-btn {
    display: inline-flex;
  }
  .main-content {
    padding: 18px;
  }
  .form-grid {
    grid-template-columns: 1fr;
  }
}

/* ==========================================
   UPGRADED FRONTEND: EXECUTIVE HERO, PIPELINE & REPORT VIEWER
   ========================================== */
.executive-hero-banner {
  background: linear-gradient(135deg, #09152b 0%, #0f2547 58%, #16376b 100%);
  color: #f8fafc;
  border-radius: var(--radius-xl);
  padding: 24px 28px;
  display: grid;
  grid-template-columns: 1.35fr 0.65fr;
  gap: 22px;
  align-items: center;
  box-shadow: var(--shadow-md);
  border: 1px solid rgba(56, 189, 248, 0.22);
  position: relative;
  overflow: hidden;
}

.executive-hero-banner::after {
  content: '';
  position: absolute;
  right: -60px;
  top: -60px;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, transparent 70%);
  pointer-events: none;
}

.hero-badge-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.hero-live-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  background: rgba(16, 185, 129, 0.18);
  color: #6ee7b7;
  border: 1px solid rgba(16, 185, 129, 0.35);
}

.hero-meta-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.08);
  color: #e2e8f0;
  border: 1px solid rgba(255, 255, 255, 0.14);
}

.executive-hero-banner h2 {
  color: #ffffff;
  font-size: 22px;
  line-height: 1.25;
  margin-bottom: 8px;
}

.executive-hero-banner p {
  color: #cbd5e1;
  font-size: 13.5px;
  max-width: 640px;
  margin-bottom: 16px;
}

.hero-cta-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.hero-telemetry-box {
  background: rgba(15, 23, 42, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  backdrop-filter: blur(8px);
}

.hero-telemetry-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12.5px;
  color: #cbd5e1;
}

.hero-telemetry-row strong {
  color: #ffffff;
  font-family: var(--font-mono);
}

/* Similarity & AI Distribution Bars */
.dist-bar-group {
  display: flex;
  flex-direction: column;
  gap: 11px;
  margin-top: 6px;
}

.dist-bar-item {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.dist-bar-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12.5px;
}

.dist-bar-track {
  height: 8px;
  border-radius: 999px;
  background: var(--bg-surface-hover);
  overflow: hidden;
}

.dist-bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.4s ease;
}

/* Chunked Upload Pipeline Stepper */
.pipeline-stepper {
  margin-top: 14px;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  background: var(--brand-primary-soft);
  border: 1px solid rgba(29, 78, 216, 0.24);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.pipeline-steps-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.pipeline-step {
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  font-size: 11.5px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  opacity: 0.6;
  transition: all 0.2s ease;
}

.pipeline-step.active,
.pipeline-step.done {
  opacity: 1;
  border-color: var(--brand-primary);
}

.pipeline-step.done {
  border-color: var(--emerald);
  background: var(--emerald-soft);
}

.pipeline-progress-track {
  height: 7px;
  border-radius: 999px;
  background: rgba(29, 78, 216, 0.15);
  overflow: hidden;
}

.pipeline-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--brand-primary), var(--emerald));
  transition: width 0.25s ease;
}

/* Upgraded Report Viewer Modal */
.report-modal-shell {
  max-width: 980px !important;
}

.report-summary-banner {
  display: grid;
  grid-template-columns: 1fr 1fr 1.35fr;
  gap: 14px;
}

.report-score-card {
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-surface-subtle);
  display: flex;
  align-items: center;
  gap: 14px;
}

.report-score-ring-wrap {
  position: relative;
  width: 80px;
  height: 80px;
  flex-shrink: 0;
}

.report-score-center {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
}

.report-score-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.report-score-eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.report-score-title {
  font-size: 14px;
  color: var(--text-primary);
}

.report-files-status-box {
  padding: 12px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-surface-subtle);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 8px;
}

.report-deliverable-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 8px;
  border-radius: 8px;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
}

.report-viewer-split {
  display: grid;
  grid-template-columns: 1.35fr 0.85fr;
  gap: 16px;
}

.report-doc-sheet {
  padding: 20px 22px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
  box-shadow: var(--shadow-xs);
}

.report-doc-sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 12px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border-color);
  font-size: 12.5px;
}

.report-doc-paragraphs {
  display: flex;
  flex-direction: column;
  gap: 12px;
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--text-primary);
}

.doc-highlight {
  padding: 2px 5px;
  border-radius: 5px;
  color: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
}

.doc-highlight-sim-1 {
  background: rgba(220, 38, 38, 0.13);
  border-bottom: 2px solid #dc2626;
}

.doc-highlight-sim-2 {
  background: rgba(217, 119, 6, 0.14);
  border-bottom: 2px solid #d97706;
}

.doc-highlight-ai {
  background: rgba(2, 132, 199, 0.14);
  border-bottom: 2px solid #0284c7;
}

.doc-highlight.focused {
  box-shadow: 0 0 0 2px var(--brand-primary);
}

.highlight-badge {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 800;
  padding: 1px 5px;
  border-radius: 4px;
  margin-right: 4px;
  background: #dc2626;
  color: #ffffff;
}

.highlight-badge.ai {
  background: #0284c7;
}

.report-sources-panel {
  padding: 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-surface-subtle);
  display: flex;
  flex-direction: column;
}

.source-match-item {
  width: 100%;
  text-align: left;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.15s ease;
}

.source-match-item:hover,
.source-match-item.active {
  border-color: var(--brand-primary);
  box-shadow: var(--shadow-xs);
}

.source-match-rank {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  background: var(--crimson-soft);
  color: var(--crimson);
  font-weight: 800;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.source-match-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.source-match-body strong {
  font-size: 12.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.source-match-body span {
  font-size: 11px;
  color: var(--text-muted);
}

.source-match-percent {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14px;
  color: var(--crimson);
}

.report-ai-Verification-card {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--brand-primary-soft);
  border: 1px solid rgba(29, 78, 216, 0.22);
}

.report-technical-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.tech-kv-card {
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--border-color);
  background: var(--bg-surface-subtle);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.tech-kv-card span {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
}

.provider-selector-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

.provider-card {
  padding: 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border-color);
  background: var(--bg-surface-subtle);
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: all 0.15s ease;
}

.provider-card.active {
  border-color: var(--brand-primary);
  background: var(--brand-primary-soft);
}

@media (max-width: 920px) {
  .executive-hero-banner,
  .report-summary-banner,
  .report-viewer-split,
  .pipeline-steps-row,
  .report-technical-grid,
  .provider-selector-grid {
    grid-template-columns: 1fr;
  }
}

/* ==========================================
   BOOTSTRAP 5 / ENTERPRISE DESIGN SYSTEM ENHANCEMENTS
   ========================================== */
.bs-summary-alert {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-left: 4px solid var(--brand-primary);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  box-shadow: var(--shadow-xs);
}

.bs-dropzone {
  padding: 28px 20px;
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius-md);
  background: linear-gradient(180deg, var(--bg-surface-subtle) 0%, var(--bg-surface) 100%);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all 0.18s ease;
}

.bs-dropzone:hover {
  border-color: var(--brand-primary);
  background: var(--brand-primary-soft);
  transform: translateY(-1px);
}

.bs-fields-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.bs-table-hover tbody tr {
  transition: background-color 0.14s ease;
}

.bs-table-hover tbody tr:hover {
  background-color: var(--bg-surface-subtle);
}

.bs-outcomes-stack {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 280px;
}

.bs-outcome-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--bg-surface-subtle);
  border: 1px solid var(--border-color);
}

.bs-outcome-err {
  background: var(--crimson-soft);
  border-color: var(--crimson-border);
}

@media (max-width: 920px) {
  .bs-fields-grid {
    grid-template-columns: 1fr;
  }
}
